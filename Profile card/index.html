<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card </title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="/1.jpg.jpg" alt="" class="profile-img">
        </div>

        <div class="text-data">
            <span class="name">Myself Ajay </span>
            <span class="job">Linkedin & Twitter</span>
        </div>

        <div class="media-btn">
            <a href="#" style="background-color:rgb(255, 51, 153) ;" class="link">
                <i class='bx bxl-instagram-alt'></i>
            </a>
            <a href="#" style="background-color:darkblue ;" class="link">
                <i class='bx bxl-linkedin-square'></i>
            </a>
            <a href="#"style="background-color: lightblue ;" class="link">
                <i class='bx bxl-twitter'></i>
            </a>
            <a href="#"style="background-color: black;" class="link">
                <i class='bx bxl-github' ></i>
            </a>
        </div>

        <div class="btns">
            <button class="button">Like</button>
            <button class="button">Thank You</button>
        </div>

</body>
</html>
